syntax = "proto3";

package session.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Duke-ECE/protos/gen/go/session/v2;v2";

// WorkspaceService owns the committed archive pointer for each session.
// It never transfers archive bytes or issues object-store credentials.
service WorkspaceService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc CommitWorkspace(CommitWorkspaceRequest) returns (CommitWorkspaceResponse);
  rpc ListWorkspacesForCleanup(ListWorkspacesForCleanupRequest) returns (ListWorkspacesForCleanupResponse);
  rpc FinishWorkspaceDeletion(FinishWorkspaceDeletionRequest) returns (FinishWorkspaceDeletionResponse);
}

message WorkspaceRevision {
  string session_id = 1;
  int64 revision = 2;
  string object_key = 3;
  string sha256 = 4;
  int64 size_bytes = 5;
  google.protobuf.Timestamp committed_at = 6;
}

message GetWorkspaceRequest {
  string session_id = 1;
  string user_id = 2; // owner path; omit for internal x-service-token access
}

message GetWorkspaceResponse {
  WorkspaceRevision workspace = 1; // revision 0 has no archive yet
}

message CommitWorkspaceRequest {
  string session_id = 1;
  int64 expected_revision = 2;
  string object_key = 3;
  string sha256 = 4;
  int64 size_bytes = 5;
  string mutation_id = 6; // stable id for idempotent retries
}

message CommitWorkspaceResponse {
  WorkspaceRevision workspace = 1;
  bool deduplicated = 2;
}

message WorkspaceCleanupTarget {
  string session_id = 1;
  string current_object_key = 2;
  google.protobuf.Timestamp deletion_requested_at = 3; // absent for an active workspace
}

message ListWorkspacesForCleanupRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListWorkspacesForCleanupResponse {
  repeated WorkspaceCleanupTarget workspaces = 1;
  bool has_more = 2;
}

message FinishWorkspaceDeletionRequest {
  string session_id = 1;
}

message FinishWorkspaceDeletionResponse {}
