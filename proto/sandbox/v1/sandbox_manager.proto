syntax = "proto3";

package sandbox.v1;

option go_package = "github.com/Duke-ECE/protos/gen/go/sandbox/v1;v1";

// SandboxManagerService is the single entry point for sandbox lifecycle operations.
// v1 scope: create and destroy sandbox pods via the k8s API server.
service SandboxManagerService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
}

message CreateSandboxRequest {
  string image = 1;        // optional, defaults to the manager's DEFAULT_IMAGE
  int64 ttl_seconds = 2;   // optional, defaults to the manager's DEFAULT_TTL_SECONDS
}

message CreateSandboxResponse {
  string sandbox_id = 1;   // the pod name, e.g. sb-3f9a1c
}

message DeleteSandboxRequest {
  string sandbox_id = 1;
}

message DeleteSandboxResponse {}
