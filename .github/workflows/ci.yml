name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      # buf breaking resolves the comparison ref from the local clone, but a
      # pull_request checkout is a detached shallow clone with no local base
      # branch (`fatal: couldn't find remote ref main`). Materialize it first.
      - name: Fetch base branch for breaking-change detection
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
      - run: buf breaking --against '.git#branch=${{ github.base_ref }},subdir=proto'
        if: github.event_name == 'pull_request'
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code
      - run: go build ./...
